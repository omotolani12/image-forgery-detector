<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Forgery Detection</title>
</head>
<body>
    <h2>Upload an Image</h2>
    <input type="file" id="imageInput" accept="image/*">
    <button onclick="uploadImage()">Predict</button>
    <p id="result"></p>

    <script>
        async function uploadImage() {
            const input = document.getElementById("imageInput");
            if (!input.files.length) return;

            const formData = new FormData();
            formData.append("file", input.files[0]);

            const response = await fetch("https://your-backend.onrender.com/predict/", {
                method: "POST",
                body: formData
            });

            const data = await response.json();
            document.getElementById("result").innerText = `Prediction: ${data.prediction}, Confidence: ${data.confidence.toFixed(2)}`;
        }
    </script>
</body>
</html>
